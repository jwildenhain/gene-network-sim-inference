services:
  grn-sim-web:
    build: .
    image: grn-sim-phpiorn:latest
    container_name: grn-sim-phpiorn
    ports:
      - "8085:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    volumes:
      # the simulation archive, exports and raw downloads persist in ./data
      - ./data:/app/data
    restart: unless-stopped
