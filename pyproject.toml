[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "grn-sim"
dynamic = ["version"]
description = "Gene regulatory network perturbation simulator and reverse-engineering inference suite, with a web studio"
readme = "README.md"
authors = [
    { name = "Jan Wildenhain", email = "jan.wildenhain@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["gene regulatory networks", "reverse engineering", "perturbation", "systems biology", "Perturb-seq", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "pandas>=1.3.0",
    "anndata>=0.8.0",
    "scikit-learn>=1.0.0",
]

[project.optional-dependencies]
# PyTorch backend of the CellBox Neural ODE; without it CellBox falls back to a SciPy optimiser.
torch = ["torch>=2.0"]
# Browser (Playwright) tests of the web studio.
browser = ["playwright>=1.40"]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/jwildenhain/gene-network-sim-inference"
Issues = "https://github.com/jwildenhain/gene-network-sim-inference/issues"
Documentation = "https://github.com/jwildenhain/gene-network-sim-inference/blob/main/SPECIFICATION.md"

[project.scripts]
grn-sim = "grn_sim.cli:main"

[tool.setuptools.dynamic]
version = { attr = "grn_sim.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# The web page and the read-only datasets (about 2.5 MB: MATLAB thesis archives, E. coli SOS data, Norman 2019
# benchmark JSONs, precomputed statistics) ship inside the wheel; see grn_sim/paths.py.
[tool.setuptools.package-data]
grn_sim = ["py.typed", "web/static/*", "data/*", "data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests marked live_server need a web studio that is already running ($GRN_SIM_URL, default http://localhost:8085)
# and they write screenshots; run them on purpose with:  pytest -m live_server
addopts = "-m 'not live_server'"
markers = [
    "live_server: needs a web studio already running at $GRN_SIM_URL (default http://localhost:8085)",
]

[tool.ruff]
line-length = 120
extend-exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501: line length is a formatting matter and not enforced. B905: zip(strict=) needs Python 3.10.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]          # re-exports
"tests/*" = ["E402"]              # tests import after setting up sys.path / environment
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.9"
files = ["src/grn_sim"]
ignore_missing_imports = true
warn_unused_ignores = true
